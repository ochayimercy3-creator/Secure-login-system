{% extends "base.html" %}
{% block content %}
<section class="panel">
    <h1>User Login</h1>
    <form method="post">
        <label>Email address</label>
        <input name="email" type="email" required>
        <label>Password</label>
        <input name="password" type="password" required>
        <button>Continue</button>
    </form>
    <p><a href="/register">Create an account</a></p>
</section>
{% endblock %}
